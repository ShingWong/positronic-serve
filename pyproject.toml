[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "positronic-serve"
version = "0.1.0"
description = "PEEP network layer — brain-as-a-service + federated polytemporal memory (port 2114, the Andrew port)"
license = "AGPL-3.0-or-later OR LicenseRef-Commercial"
requires-python = ">=3.10"
dependencies = [
  "cryptography>=41",
  "starlette",
  "uvicorn",
  "positronic-agent-interface @ git+https://github.com/ShingWong/positronic-agent-interface.git@main",
]

[project.optional-dependencies]
# starlette is deliberately unpinned, so the HTTP client its test client needs
# moves with it: starlette >= 1.7 needs httpx2 (not httpx) for
# starlette.testclient. Without this the suite cannot even be collected on a
# clean install, while local runs keep passing on an older starlette.
test = ["pytest>=8", "ruff", "httpx2"]

[project.scripts]
positronic-serve = "positronic_serve.cli:main"

[tool.setuptools.packages.find]
include = ["positronic_serve*"]

[tool.pytest.ini_options]
testpaths = ["tests"]